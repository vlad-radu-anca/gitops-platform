# Each route sits in the namespace of the Service it targets, which the
# gateway's allowedRoutes permits without a ReferenceGrant.
# Reach them at http://<host>:8080 once the kind cluster is up.
#
# The values the API server would default (group, kind, weight and the
# PathPrefix match) are written out on purpose. They sit inside list items,
# where Argo CD's diff cannot account for schema defaults of a custom
# resource, so leaving them out keeps every route permanently OutOfSync.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: podinfo-dev
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
  hostnames:
    - podinfo-dev.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: podinfo
          port: 9898
          weight: 1
---
