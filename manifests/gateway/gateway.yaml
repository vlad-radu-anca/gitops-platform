# kind has no cloud load balancer, so Envoy's Service is a NodePort on 30080,
# which bootstrap/kind-cluster.yaml maps to localhost:8080 on the control plane
# node. Envoy Gateway defaults the Service to externalTrafficPolicy: Local, under
# which a node only accepts NodePort traffic for pods running on that node, and
# Envoy runs on a worker. Cluster lets any node forward the traffic.
#
# The Service gets a fixed name, platform-gateway, instead of the generated
# one, so in-cluster clients such as synthetic probes have a stable address
# for "the front door".
#
# Per-virtual-host statistics give request counts and latency per hostname,
# which is what per-service SLOs are built on. Envoy's per-route cluster
# counters are not enough: they reset whenever the backend's endpoints change.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-nodeport
  namespace: envoy-gateway-system
spec:
  telemetry:
    metrics:
      enableVirtualHostStats: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: platform-gateway
        type: NodePort
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind-nodeport
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.localtest.me"
      # Routes live next to the Service they point at, in any namespace, so no
      # cross-namespace ReferenceGrant is needed.
      allowedRoutes:
        namespaces:
          from: All
