apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.9.1
    helm:
      releaseName: envoy-gateway
      valuesObject:
        # CRDs and the Gateway API safe-upgrades admission policy come from the
        # envoy-gateway-crds Application. Left on, this chart renders the same
        # policy from a subchart's templates (skipCrds does not reach those), and
        # the two Applications fight over it and stay OutOfSync.
        crds:
          enabled: false
  destination:
    {{- include "apps.destination" "envoy-gateway-system" | nindent 4 }}
  syncPolicy:
    {{- include "apps.syncPolicy" . | nindent 4 }}
