{{- if .Values.monitoring.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.8.1
    helm:
      releaseName: monitoring
      valuesObject:
        grafana:
          # Credentials come from the ExternalSecret in platform-config, rather
          # than the chart's well-known default password.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
        prometheus:
          prometheusSpec:
            retention: 6h
            resources:
              requests:
                cpu: 100m
                memory: 400Mi
            # Pick up rules, monitors and probes from every namespace, not only
            # those labelled for this Helm release. Teams ship their own SLO
            # rules and scrape configs next to their services, without needing
            # to know the platform's internal labels.
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
        alertmanager:
          enabled: true
          alertmanagerSpec:
            # Routing comes from AlertmanagerConfig resources owned by teams.
            # The default strategy adds a namespace matcher to each of them,
            # which alerts from rules without a namespace label never match.
            alertmanagerConfigMatcherStrategy:
              type: None
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
        # kind runs these control plane components without exposed metrics.
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    {{- include "apps.destination" "monitoring" | nindent 4 }}
  syncPolicy:
    {{- include "apps.syncPolicy" . | nindent 4 }}
{{- end }}
